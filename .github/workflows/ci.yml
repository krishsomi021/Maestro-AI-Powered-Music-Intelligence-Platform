name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsuser
          POSTGRES_PASSWORD: jobspassword
          POSTGRES_DB: jobsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobsuser -d jobsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: jobsuser
      POSTGRES_PASSWORD: jobspassword
      POSTGRES_DB: jobsdb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      APP_ENV: development
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: psql postgresql://jobsuser:jobspassword@localhost:5432/jobsdb -f migrations/init.sql

      - name: Run tests
        run: pytest tests/ -v
